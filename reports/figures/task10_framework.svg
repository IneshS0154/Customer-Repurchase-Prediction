<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 640" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#44546a"/>
    </marker>
  </defs>
  <rect width="980" height="640" fill="#ffffff"/>
  <text x="490" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#1f2d3d">Customer Repurchase Early-Warning System — conceptual framework</text>

  <!-- stage labels -->
  <g font-size="11" fill="#6b7785" text-anchor="middle" font-weight="bold" letter-spacing="0.5">
    <text x="95" y="62">1 · DATA</text>
    <text x="290" y="62">2 · FEATURES</text>
    <text x="485" y="62">3 · MODELS</text>
    <text x="680" y="62">4 · DECISIONS</text>
    <text x="875" y="62">5 · ACTIONS</text>
  </g>

  <!-- main boxes -->
  <g stroke-width="1.5">
    <rect x="15"  y="72" width="160" height="230" rx="8" fill="#eef3f8" stroke="#8aa4c2"/>
    <rect x="210" y="72" width="160" height="230" rx="8" fill="#eef3f8" stroke="#8aa4c2"/>
    <rect x="405" y="72" width="160" height="230" rx="8" fill="#e8f1ec" stroke="#7fae93"/>
    <rect x="600" y="72" width="160" height="230" rx="8" fill="#fbf1e3" stroke="#d6a45c"/>
    <rect x="795" y="72" width="170" height="230" rx="8" fill="#fbf1e3" stroke="#d6a45c"/>
  </g>

  <g font-size="13" fill="#1f2d3d">
    <text x="95" y="96" text-anchor="middle" font-weight="bold">Data sources</text>
    <text x="27" y="122">• Invoice lines (orders,</text>
    <text x="37" y="139">cancellations, prices)</text>
    <text x="27" y="161">• Customer accounts</text>
    <text x="37" y="178">(ID, country)</text>
    <text x="27" y="200">• Campaign log (offers</text>
    <text x="37" y="217">sent, to whom, when)</text>
    <text x="27" y="239">• Holdout assignments</text>
    <text x="27" y="275" font-size="11.5" fill="#44546a">Cleaning rules as in</text>
    <text x="27" y="290" font-size="11.5" fill="#44546a">Task 3 (notebook 00)</text>

    <text x="290" y="96" text-anchor="middle" font-weight="bold">Feature pipeline</text>
    <text x="222" y="122">Weekly, as of each</text>
    <text x="222" y="139">scoring date (no future</text>
    <text x="222" y="156">data — cutoff design):</text>
    <text x="222" y="180">• Recency, Frequency,</text>
    <text x="232" y="197">Monetary, tenure</text>
    <text x="222" y="219">• Avg order value,</text>
    <text x="232" y="236">breadth, cancel rate</text>
    <text x="222" y="258">• UK / international,</text>
    <text x="232" y="275">Q4-acquired flag</text>

    <text x="485" y="96" text-anchor="middle" font-weight="bold">Scoring models</text>
    <text x="417" y="122">• P(repurchase in 90 d):</text>
    <text x="427" y="139">elastic-net logistic</text>
    <text x="427" y="156">(Task 5; CV AUC 0.80)</text>
    <text x="417" y="180">• E[spend | returns]:</text>
    <text x="427" y="197">Gamma GLM (Task 5)</text>
    <text x="417" y="221">• Thin countries / new</text>
    <text x="427" y="238">accounts: hierarchical</text>
    <text x="427" y="255">Bayes (Task 8)</text>
    <text x="417" y="279">• Recalibrated regularly</text>

    <text x="680" y="96" text-anchor="middle" font-weight="bold">Decision layer</text>
    <text x="612" y="122">Expected spend =</text>
    <text x="612" y="139">P × E[spend | returns]</text>
    <text x="612" y="163">Contact if</text>
    <text x="612" y="180" font-size="12">uplift × margin × E[spend]</text>
    <text x="612" y="197">&gt; offer cost</text>
    <text x="612" y="221">Tiers:</text>
    <text x="612" y="238">A Secure high value</text>
    <text x="612" y="255">B At-risk high value</text>
    <text x="612" y="272">C Lapsing low value</text>
    <text x="612" y="289">D New / thin history</text>

    <text x="880" y="96" text-anchor="middle" font-weight="bold">Actions</text>
    <text x="807" y="122">• Dashboard: ranked</text>
    <text x="817" y="139">list by tier, reasons</text>
    <text x="817" y="156">(recency, frequency)</text>
    <text x="807" y="180">• A: service contact,</text>
    <text x="817" y="197">no discount</text>
    <text x="807" y="219">• B: tested offer</text>
    <text x="807" y="241">• C: low-cost e-mail</text>
    <text x="807" y="263">• D: onboarding series</text>
    <text x="807" y="285" font-size="11" fill="#44546a">Holdout kept in every campaign</text>
  </g>

  <!-- forward arrows -->
  <g stroke="#44546a" stroke-width="2" fill="none" marker-end="url(#arr)">
    <line x1="175" y1="187" x2="207" y2="187"/>
    <line x1="370" y1="187" x2="402" y2="187"/>
    <line x1="565" y1="187" x2="597" y2="187"/>
    <line x1="760" y1="187" x2="792" y2="187"/>
  </g>

  <!-- feedback loop box -->
  <rect x="405" y="350" width="560" height="110" rx="8" fill="#f3eefa" stroke="#9b85c4" stroke-width="1.5"/>
  <g font-size="13" fill="#1f2d3d">
    <text x="685" y="374" text-anchor="middle" font-weight="bold">6 · Experiment &amp; learning loop (Task 6)</text>
    <text x="420" y="398">Randomised holdout within each tier (RCBD) → measured uplift per tier after 90 days</text>
    <text x="420" y="420">→ replaces the assumed uplift in the decision rule;  realised outcomes → new training labels</text>
    <text x="420" y="442">→ quarterly retraining.  Stop / refine / go decisions against the pre-registered threshold.</text>
  </g>
  <g stroke="#7a62a8" stroke-width="2" fill="none" marker-end="url(#arr)">
    <path d="M880,302 L880,347"/>
    <path d="M680,350 L680,305"/>
    <path d="M485,350 L485,305"/>
  </g>
  <g font-size="11" fill="#5b4a80">
    <text x="886" y="330">outcomes</text>
    <text x="686" y="333">uplift</text>
    <text x="491" y="333">labels</text>
  </g>

  <!-- monitoring & governance -->
  <rect x="15" y="495" width="950" height="125" rx="8" fill="#f6f6f6" stroke="#b3b3b3" stroke-width="1.5"/>
  <g font-size="13" fill="#1f2d3d">
    <text x="490" y="519" text-anchor="middle" font-weight="bold">7 · Monitoring &amp; governance (runs across every stage)</text>
    <text x="30" y="545">• Weekly: scoring run, data-quality checks (row counts, missing IDs, non-product codes)</text>
    <text x="30" y="567">• Monthly: feature drift and base-rate drift; AUC and calibration on cohorts whose 90-day window has closed</text>
    <text x="30" y="589">• Triggers: recalibrate every campaign period; retrain if AUC &lt; 0.76 (recency-rule level) or calibration off by &gt; 5 points</text>
    <text x="30" y="611">• Data protection (lawful basis, minimisation, right to object) and fairness checks (offer rates by country and size tier)</text>
  </g>
  <line x1="95" y1="302" x2="95" y2="492" stroke="#b3b3b3" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="290" y1="302" x2="290" y2="492" stroke="#b3b3b3" stroke-width="1.5" stroke-dasharray="5 4"/>
</svg>
